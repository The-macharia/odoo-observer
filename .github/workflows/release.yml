name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash test/check.sh
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
      - name: Publish and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          # servers that follow vN pick this release up on their next Observer run; a patch to an
          # older line (v1.0.1 after v1.2.0) must not drag vN backwards
          major=${TAG%%.*}
          git fetch -q --tags origin
          latest=$(git tag -l "$major.*" --sort=-v:refname | head -1)
          [ "$latest" = "$TAG" ] || { echo "$TAG is older than $latest; $major stays"; exit 0; }
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
