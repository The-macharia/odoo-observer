apiVersion: 1

prune: true

# Dashboards pick the Loki source whose name is "<prometheus name> logs", so keep that pairing.
datasources:
  - name: __CLIENT__
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s
  - name: __CLIENT__ logs
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      maxLines: 5000
  - name: __CLIENT__ db
    uid: pg
    type: grafana-postgresql-datasource
    url: __DB_HOST__:__DB_PORT__
    user: observer
    jsonData:
      database: __DB__
      sslmode: __DB_SSLMODE__
      postgresVersion: 1600
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 300
    secureJsonData:
      password: $DB_PASSWORD
